<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joe Ratterman</title>
  <meta name="description" content="Joe Ratterman personal website.">
  <link rel="stylesheet" href="css/styles.css?v=20261007b">
</head>
<body>
  <header class="site-header">
    <a class="logo-link" href="index.html" aria-label="Joe Ratterman home">
      <img class="site-logo" src="images/joeratterman.webp" alt="joeratterman.com">
    </a>

    <nav class="site-nav" aria-label="Main menu">
      <a class="active" href="index.html">Home</a>
      <a href="about.html">About Me</a>
      <a href="resources.html">Resources</a>
      <a href="projects.html">Projects</a>
      <a href="files.html">Files</a>
    </nav>
  </header>

  <main class="page-main home-main">
    <div id="goodwords-fallback" class="goodwords-fallback">
      <a href="https://goodwords.today/">Read today's Good Words</a>
    </div>
    <iframe id="goodwords-frame" class="goodwords-frame" title="Good Words daily verse, quote, and joke" referrerpolicy="origin" scrolling="no"></iframe>
  </main>

  <footer class="site-footer">
    <p>Copyright © 2010-2026 joeratterman.com</p>
  </footer>
  <script>
    const goodwordsFrame = document.querySelector('#goodwords-frame');
    const goodwordsFallback = document.querySelector('#goodwords-fallback');
    const localPreview = ['localhost', '127.0.0.1'].includes(location.hostname) &&
      new URLSearchParams(location.search).get('goodwords') === 'local';
    const goodwordsUrl = new URL(localPreview ? 'http://127.0.0.1:8787/' : 'https://goodwords.today/');
    goodwordsUrl.searchParams.set('embed', '1');
    window.addEventListener('message', event => {
      if (event.source !== goodwordsFrame.contentWindow || event.origin !== goodwordsUrl.origin) return;
      if (event.data?.type !== 'goodwords:height') return;
      const height = event.data.height;
      if (Number.isSafeInteger(height) && height > 0 && height < 1000000) {
        goodwordsFrame.style.height = `${height}px`;
        goodwordsFrame.classList.add('is-ready');
        goodwordsFallback.hidden = true;
      }
    });
    goodwordsFrame.src = goodwordsUrl.href;
  </script>
</body>
</html>
